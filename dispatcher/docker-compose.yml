services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
      POSTGRES_DB: dispatcher_dev
    ports:
      - "5436:5432" # distinct from ledger's (5432), depositwatcher's (5433), screening's (5434), energybroker's (5435), and s1's (5437), so all six can run together -- the port this module's own build doc already claimed
    volumes:
      - dispatcher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  dispatcher_pgdata:
