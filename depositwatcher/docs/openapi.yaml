openapi: 3.1.0
info:
  title: C2 Deposit Watcher API
  version: "1.0.0"
  description: >
    Service-to-service HTTP boundary for C2, the deposit watcher. No
    customer-facing auth and no per-customer scoping -- C6 owns that, the
    same posture as C1's ledger core API. Every write handler requires an
    Idempotency-Key header. Every amount is a decimal string, never a
    JSON number.
servers:
  - url: /
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Process is up.

  /readyz:
    get:
      summary: Readiness check (process up AND database reachable)
      security: []
      responses:
        "200":
          description: Ready to serve.
        "503":
          description: Not ready (database unreachable).

  /metrics:
    get:
      summary: Prometheus exposition format
      security: []
      responses:
        "200":
          description: >
            watcher_candidates_detected_total,
            watcher_candidates_finalized_total,
            watcher_reports_to_ledger_total{code},
            watcher_orphaned_deposits_total,
            watcher_provider_agreement_failures_total,
            watcher_cursor_lag_blocks, plus standard Go/process metrics.

  /v1/addresses:
    post:
      summary: Assign a deposit address to an order
      description: >
        Idempotent on order_id: calling twice with the same order_id
        returns 200 both times with the identical address, never 201 then
        200 -- a first-time assignment and a replay of one are not
        distinguishable by status code here, unlike C1's Created-vs-
        Replayed journal entries.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAddressRequest"
      responses:
        "200":
          description: The assigned (or previously assigned) address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      summary: List every watched address, newest first
      description: >
        Includes RETIRED addresses deliberately -- a settled order's own
        deposit address still holds its real on-chain balance until an
        operator manually sweeps it (the ops console's own Sweep page).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }

  /v1/addresses/{order_id}:
    get:
      summary: Look up the address assigned to an order
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: The watched address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/addresses/{order_id}/balance:
    get:
      summary: Current on-chain balance of the watched token at this address
      description: >
        Single-provider read, advisory only (see chain.Pool.ERC20BalanceOf's
        own doc comment) -- the ops console's own Sweep page.
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { type: string }
                  balance_raw: { type: string, description: "raw token units, as a decimal string" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: No RPC provider pool is configured on this instance. }

  /v1/addresses/{order_id}/retire:
    post:
      summary: Retire an order's watched address
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The retired address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/addresses/{order_id}/confirm-deposit:
    post:
      summary: Manually confirm a specific on-chain transaction as this order's deposit
      description: >
        admin-panel-build-prompts.md's OC.12 -- an operator-supplied "look
        at this specific transaction" trigger, not a manual override that
        skips verification. Locates the transaction's own block, re-reads
        that block's Transfer logs under the same 2-provider agreement
        bar the background scanner's own range-scan uses, and -- only if
        a matching log paying this order's own deposit address is found
        -- feeds it through the exact same classification and finality
        tracking a normally-detected deposit goes through. Idempotent:
        resubmitting the same tx_hash is a no-op, not a double-credit.
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tx_hash]
              properties:
                tx_hash: { type: string, description: "0x-prefixed 32-byte transaction hash." }
      responses:
        "200":
          description: Accepted -- will credit once finality confirms it, same as any other deposit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: integer, format: int64 }
                  tx_hash: { type: string }
                  block_number: { type: integer }
                  accepted: { type: boolean }
        "400":
          description: Malformed tx_hash, or a well-formed transaction that pays some OTHER address, not this order's own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No matching Transfer log for this tx_hash was found (wrong hash, or not yet mined).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The transaction exists but its log isn't a Transfer event at all.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Locating the transaction or its logs on-chain failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { description: This instance has no live chain-watching engine configured. }

  /v1/orphaned-deposits:
    get:
      summary: List orphaned deposits (gap #3's capture-and-surface mechanism)
      description: >
        A deposit that finalized on-chain for an order C1 no longer
        considers open. This endpoint never decides what to do about one
        -- it exists purely for operator visibility and manual
        reconciliation.
      parameters:
        - name: resolved
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Orphaned deposits, most recently detected first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposits:
                    type: array
                    items: { $ref: "#/components/schemas/OrphanedDeposit" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/orphaned-deposits/{id}/resolve:
    post:
      summary: Record how an orphaned deposit was resolved
      description: >
        resolved_by is the authenticated actor (the bearer token), never
        a request body field -- this system's actor convention
        everywhere else. Fails 409 already_resolved rather than silently
        overwriting a prior resolution.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string }
      responses:
        "200":
          description: The resolved deposit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrphanedDeposit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/system/providers:
    get:
      summary: Per-provider RPC health
      responses:
        "200":
          description: Provider health snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderHealth" }
        "503":
          description: No RPC provider pool is configured on this instance.

  /v1/system/invariants:
    get:
      summary: Cursor lag, pending-finality count, oldest pending candidate age
      description: >
        Each field is independently omitted, not a 503 for the whole
        endpoint, if its own source isn't configured on this instance.
      responses:
        "200":
          description: Current invariant readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invariants" }

  /v1/system/cursor:
    get:
      summary: Raw ingestion_cursor row
      description: >
        The first route to expose last_scanned/last_candidate_scanned
        directly -- every prior operator-facing signal only ever derived a
        lag number from them.
      responses:
        "200":
          description: Current cursor state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cursor" }
    post:
      summary: Manually set the ingestion cursor (operator override)
      description: >
        Closes a real gap: both real MVP proof runs needed this set by
        hand, directly against Postgres. Validates
        last_candidate_scanned <= last_scanned and refuses to set either
        value past the chain's own current tip.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last_scanned, last_candidate_scanned, reason]
              properties:
                last_scanned: { type: integer, format: int64 }
                last_candidate_scanned: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        "200":
          description: Updated cursor state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cursor" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Service-to-service only. One token per service identity; the
        token maps to the actor recorded on every write. Designed so mTLS
        could replace this without touching any handler.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: invalid_request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: order_not_found or orphaned_deposit_not_found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: illegal_transition or already_resolved.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    PostAddressRequest:
      type: object
      required: [order_id, external_id, customer_id, quoted_at, quote_expires_at]
      properties:
        order_id: { type: integer, format: int64 }
        external_id: { type: string }
        customer_id: { type: string }
        quoted_at: { type: string, format: date-time }
        quote_expires_at: { type: string, format: date-time }

    Address:
      type: object
      properties:
        address: { type: string }
        derivation_index: { type: integer }
        order_id: { type: integer, format: int64 }
        external_id: { type: string }
        customer_id: { type: string }
        status: { type: string, enum: [WATCHING, FUNDED, RETIRED] }
        quoted_at: { type: string, format: date-time }
        quote_expires_at: { type: string, format: date-time }
        assigned_at: { type: string, format: date-time }
        retired_at: { type: string, format: date-time }
        retired_reason: { type: string }

    OrphanedDeposit:
      type: object
      properties:
        id: { type: integer, format: int64 }
        order_id: { type: integer, format: int64 }
        external_id: { type: string }
        tx_hash: { type: string }
        log_index: { type: integer }
        amount: { type: string, description: Decimal string, never a JSON number. }
        detected_at: { type: string, format: date-time }
        order_state_at_detection: { type: string }
        resolution: { type: string }
        resolved_at: { type: string, format: date-time }
        resolved_by: { type: string }

    ProviderHealth:
      type: object
      properties:
        name: { type: string }
        healthy: { type: boolean }
        consecutive_failures: { type: integer }
        total_rounds: { type: integer }
        total_failures: { type: integer }
        last_error: { type: string }

    Invariants:
      type: object
      properties:
        cursor_lag_blocks: { type: integer, format: int64 }
        pending_finality_count: { type: integer }
        oldest_pending_candidate_age_seconds: { type: number }

    Cursor:
      type: object
      properties:
        last_scanned: { type: integer, format: int64 }
        last_candidate_scanned: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
