services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: s1
      POSTGRES_PASSWORD: s1
      POSTGRES_DB: s1_dev
    ports:
      - "5437:5432" # distinct from ledger's (5432), depositwatcher's (5433), screening's (5434), energybroker's (5435), and dispatcher's claimed (5436), so all six can run together
    volumes:
      - s1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s1 -d s1_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  s1_pgdata:
