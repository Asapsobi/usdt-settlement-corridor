services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: screening
      POSTGRES_PASSWORD: screening
      POSTGRES_DB: screening_dev
    ports:
      - "5434:5432" # distinct from ledger's (5432) and depositwatcher's (5433), so all three can run together
    volumes:
      - screening_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screening -d screening_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  screening_pgdata:
