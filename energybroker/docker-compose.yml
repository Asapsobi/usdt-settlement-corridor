services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker_dev
    ports:
      - "5435:5432" # distinct from ledger's (5432), depositwatcher's (5433), and screening's (5434), so all four can run together
    volumes:
      - broker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  broker_pgdata:
