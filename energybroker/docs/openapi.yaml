openapi: 3.1.0
info:
  title: C4 Energy Broker API
  version: "1.0.0"
  description: >
    Service-to-service HTTP boundary for C4, the energy broker. Bearer
    auth is this service's own token, distinct from any of C1/C2/C3's
    tokens -- see BROKER_API_TOKENS. POST /v1/reservations blocks
    synchronously through the fast path or the slow path's own
    retry-until-deadline loop and returns the reservation's FINAL status
    (never a 202-pending placeholder) -- set your HTTP client's own
    timeout past the reservation's own deadline accordingly.
servers:
  - url: /
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Process is up.

  /readyz:
    get:
      summary: Readiness check (process up AND database reachable)
      security: []
      responses:
        "200":
          description: Ready to serve.
        "503":
          description: Not ready (database unreachable).

  /metrics:
    get:
      summary: Prometheus exposition format
      security: []
      responses:
        "200":
          description: >
            broker_reservations_total{outcome=fast_path|slow_path|failed},
            broker_buffer_level{provider}, broker_buffer_target,
            broker_replenish_cost_trx_total{provider},
            broker_manual_fallback_events_total,
            broker_ceiling_rejections_total{provider},
            broker_price_staleness_seconds{provider}, plus standard
            Go/process metrics.

  /v1/reservations:
    post:
      summary: Reserve energy for one order, blocking through resolution
      description: >
        Idempotency-Key header is required -- retrying the same key
        returns the same reservation rather than creating a second one.
        Synchronous: blocks through the fast path or the slow path's own
        retry-until-deadline loop and returns the FINAL status (CONFIRMED
        or FAILED), never a 202-pending placeholder.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservationRequest" }
      responses:
        "201":
          description: Created (status is CONFIRMED or FAILED -- see description above).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: order_not_found -- C1 has no order with that external_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: upstream_error -- C1 returned an unexpected error resolving this order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List reservations by status
      description: >
        At least one status is required. The first route to list
        reservations at all -- GET /v1/reservations/{id} is, and remains,
        get-by-id-only.
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: array
            items: { type: string, enum: [PENDING, CONFIRMED, FAILED] }
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/reservations/{id}:
    get:
      summary: Fetch one reservation
      parameters:
        - $ref: "#/components/parameters/ReservationID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/reservations/{id}/reconcile:
    post:
      summary: Manually confirm a wrongly-FAILED reservation (operator override)
      description: >
        The HTTP form of cmd/reconcile-reservation's own ManualConfirm
        call. Never called from POST /v1/reservations' own path -- the
        caller is vouching for a delegation independently verified real,
        e.g. read directly on-chain against the vendor's own target
        address.
      parameters:
        - $ref: "#/components/parameters/ReservationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, provider, delegation_id, target_address, energy_units, cost_trx]
              properties:
                order_id: { type: integer, format: int64 }
                provider: { type: string }
                delegation_id: { type: string }
                target_address: { type: string }
                energy_units: { type: integer, format: int64 }
                cost_trx: { type: string }
      responses:
        "200":
          description: OK -- the reservation, now CONFIRMED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/buffer:
    get:
      summary: Current AVAILABLE/RESERVED totals by provider
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BufferTotals" }

  /v1/manual-fallback-events:
    get:
      summary: List manual fallback events (C4.6)
      description: resolved omitted lists every event (newest first); resolved=true/false filters.
      parameters:
        - name: resolved
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FallbackEventList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/manual-fallback-events/{id}/resolve:
    post:
      summary: Mark a manual fallback event resolved
      description: >
        actor comes from the request body, not this API's own bearer
        auth -- the calling ops tool establishes who the human operator
        is, the same posture screening's own hold-resolution endpoints
        take.
      parameters:
        - $ref: "#/components/parameters/FallbackEventID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveFallbackEventRequest" }
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FallbackEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/system/prices:
    get:
      summary: Latest price snapshot per provider, plus configured ceiling and weights
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceSnapshot" }

  /v1/system/invariants:
    get:
      summary: Buffer level vs target, reconciliation lag, fast/slow-path ratio, open fallback events
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invariants" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ReservationID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    FallbackEventID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: invalid_request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: reservation_not_found / fallback_event_not_found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    CreateReservationRequest:
      type: object
      required: [external_id, target_address, energy_units, tier, deadline]
      properties:
        external_id: { type: string }
        target_address: { type: string }
        energy_units: { type: integer, format: int64 }
        tier: { type: string }
        deadline: { type: string, format: date-time }

    Reservation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        external_id: { type: string }
        order_id: { type: integer, format: int64 }
        target_address: { type: string }
        energy_units: { type: integer, format: int64 }
        tier: { type: string }
        status: { type: string, enum: [PENDING, CONFIRMED, FAILED] }
        vendor: { type: string, nullable: true }
        cost_trx: { type: string, nullable: true, description: "Decimal TRX amount, e.g. \"24.500000\"." }
        confirmed_at: { type: string, format: date-time, nullable: true }
        deadline: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        fast_path: { type: boolean, nullable: true, description: "true if confirmed from the standing buffer; false if confirmed via the slow path; null if not yet confirmed." }

    ProviderTotal:
      type: object
      properties:
        provider_name: { type: string }
        available: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }

    BufferTotals:
      type: object
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderTotal" }

    FallbackEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        triggered_at: { type: string, format: date-time }
        reason: { type: string, enum: [all_unhealthy, all_over_ceiling] }
        order_id: { type: integer, format: int64, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolution: { type: string, nullable: true }
        resolved_by: { type: string, nullable: true }

    FallbackEventList:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/FallbackEvent" }

    ResolveFallbackEventRequest:
      type: object
      required: [resolution, actor]
      properties:
        resolution: { type: string }
        actor: { type: string }

    PriceStatus:
      type: object
      properties:
        provider_name: { type: string }
        price_per_unit_sun: { type: number, nullable: true }
        observed_at: { type: string, format: date-time, nullable: true }
        healthy: { type: boolean }
        error: { type: string, nullable: true }

    PriceSnapshot:
      type: object
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/PriceStatus" }
        ceiling_sun_per_unit: { type: number }
        weights:
          type: object
          additionalProperties: { type: number }

    Invariants:
      type: object
      properties:
        buffer_available: { type: integer, format: int64 }
        buffer_target: { type: integer, format: int64 }
        reconciliation_lag_seconds: { type: number, nullable: true }
        fast_path_confirmed_count: { type: integer, format: int64 }
        slow_path_confirmed_count: { type: integer, format: int64 }
        fast_path_ratio: { type: number, nullable: true }
        open_manual_fallback_events: { type: integer, format: int64 }
